,Sains:[["1. Tata Surya",'<ol><li>Merkurius</li><li>Venus</li><li>Bumi</li><li>Mars</li><li>Jupiter</li><li>Saturnus</li><li>Uranus</li><li>Neptunus</li></ol>'],["2. Fotosintesis",'<div class="code-block">CO2 + H2O + cahaya -> glukosa + O2</div>'],["3. Sel",'<ul><li>Membran sel</li><li>Sitoplasma</li><li>Nukleus</li><li>Mitokondria</li></ul>'],["4. Hukum Newton",'<ul><li>1: benda diam tetap diam.</li><li>2: F = m x a</li><li>3: aksi = reaksi</li></ul>']],Sejarah:[["1. Kemerdekaan RI","<p>17 Agustus 1945 - Proklamasi oleh Soekarno-Hatta.</p>"],["2. Perang Dunia II","<p>1939-1945. Sekutu vs Poros.</p>"],["3. Majapahit","<p>1293-1527. Puncak di era Hayam Wuruk & Gajah Mada.</p>"],["4. Revolusi Industri","<p>Dimulai di Inggris abad 18. Tenaga manusia -> mesin.</p>"]],Bisnis:[["1. Dasar Bisnis","<ul><li><b>Produk</b></li><li><b>Pasar</b></li><li><b>Laba</b></li></ul>"],["2. Marketing 4P","<ul><li>Product</li><li>Price</li><li>Place</li><li>Promotion</li></ul>"],["3. Ide Modal Minim","<ul><li>Jasa titip beli</li><li>Konten kreator</li><li>Freelance</li></ul>"],["4. Keuangan Usaha","<p><b>laba = pemasukan - pengeluaran</b></p>"]],Desain:[["1. Prinsip Desain","<ul><li>Keseimbangan</li><li>Kontras</li><li>Kesatuan</li><li>Hierarki</li></ul>"],["2. Warna","<ul><li>Monokromatik</li><li>Komplementer</li><li>Analogus</li></ul>"],["3. Tipografi","<ul><li><b>Serif</b> - formal</li><li><b>Sans-serif</b> - modern</li></ul>"],["4. UI/UX Dasar","<ul><li>Konsisten</li><li>Mudah dibaca</li><li>Aksesibel</li></ul>"]]};
function renderLearn(){var k=Object.keys(LESSONS),c=k.map(function(x){return'<div class="learn"><h3><span class="learn-icon">'+IC("book")+'</span>'+escapeHTML(x)+'</h3><p style="color:#8b94a3;margin:6px 0 10px;font-size:13.5px">'+LESSONS[x].length+' modul materi</p><button class="action" onclick="openLessons(\''+x+'\')">Mulai belajar '+IC("send","ic-sm")+'</button></div>'}).join("");document.getElementById("main").innerHTML='<div class="card"><h2 class="card-title">'+IC("book")+' Belajar</h2><p style="color:#8b94a3;font-size:13.5px;margin:0 0 16px">Pilih kategori materi.</p><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px">'+c+'</div></div>'}
function openLessons(c){var l=LESSONS[c]||[];openModal('<h2>'+IC("book")+' '+escapeHTML(c)+'</h2><p style="color:#8b94a3;font-size:13px">Pilih modul:</p><div class="chat-list">'+l.map(function(x,i){return'<button class="user-item" onclick="openLesson(\''+c+'\','+i+')"><b>'+escapeHTML(x[0])+'</b></button>'}).join("")+'</div>')}
function openLesson(c,i){var l=LESSONS[c][i];openModal('<h2>'+escapeHTML(l[0])+'</h2><div style="line-height:1.7">'+l[1]+'</div><div style="display:flex;justify-content:space-between;margin-top:20px;gap:8px"><button class="btn" style="background:#1b2027;color:#eef1f5;width:auto" onclick="openLessons(\''+c+'\')">Daftar</button><button class="btn primary" style="width:auto" onclick="closeModal()">Selesai</button></div>')}
function renderChat(){var o=users.filter(function(u){return u.id!==currentUser.id&&!u.banned}),h=o.map(function(u){return'<button class="user-item" onclick="openChat(\''+u.id+'\')"><div style="display:flex;gap:12px;align-items:center"><div class="avatar">'+escapeHTML(u.avatar)+'</div><div style="flex:1;min-width:0"><b>'+escapeHTML(u.name)+'</b><div style="color:#8b94a3;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escapeHTML(u.email)+'</div></div></div></button>'}).join("");document.getElementById("main").innerHTML='<div class="card"><h2 class="card-title">'+IC("chat")+' Chat</h2><p style="color:#8b94a3;font-size:13px;margin:0 0 14px">Pilih pengguna.</p><div class="chat-list">'+(o.length?h:'<div class="empty">Belum ada pengguna lain.</div>')+'</div></div>'}
function openChat(id){var u=users.find(function(x){return x.id===id});if(!u)return;var ms=chats.filter(function(m){return(m.from===currentUser.id&&m.to===id)||(m.from===id&&m.to===currentUser.id)});openModal('<h2>Chat dengan '+escapeHTML(u.name)+'</h2><div id="messages" class="messages">'+(ms.length?ms.map(renderMessage).join(""):'<div class="empty">Belum ada pesan.</div>')+'</div><div class="comment-box"><input id="chatInput" placeholder="Tulis pesan..." onkeydown="if(event.key===\'Enter\') sendChat(\''+id+'\')"><button class="action" onclick="sendChat(\''+id+'\')">'+IC("send","ic-sm")+' Kirim</button></div><label class="attach-label" for="chatImage">'+IC("paperclip","ic-sm")+' Kirim gambar</label><input id="chatImage" type="file" accept="image/*" onchange="sendChatImage(\''+id+'\')">');setTimeout(function(){var b=document.getElementById("messages");if(b)b.scrollTop=b.scrollHeight},50)}
function renderMessage(m){return'<div class="msg '+(m.from===currentUser.id?"mine":"")+'">'+(m.image?'<img src="'+m.image+'" style="max-width:200px;max-height:200px;border-radius:10px">':"")+(m.text?'<div>'+escapeHTML(m.text)+'</div>':"")+'</div>'}
function sendChat(id){var i=document.getElementById("chatInput"),t=i.value.trim();if(!t)return;chats.push({id:uid(),from:currentUser.id,to:id,text:t,image:null,time:new Date().toISOString()});saveAll();openChat(id)}
function sendChatImage(id){var f=document.getElementById("chatImage").files[0];if(!f)return;var r=new FileReader();r.onload=function(){chats.push({id:uid(),from:currentUser.id,to:id,text:"",image:r.result,time:new Date().toISOString()});saveAll();openChat(id)};r.readAsDataURL(f)}
function renderTrending(){var l=posts.filter(function(p){return!p.deleted}).sort(function(a,b){return(b.votes||0)-(a.votes||0)});document.getElementById("main").innerHTML='<div class="card"><h2 class="card-title">Trending</h2>'+(l.length?l.map(renderPost).join(""):'<div class="empty">Belum ada postingan.</div>')+'</div>'}
function renderMiniTrending(){var b=document.getElementById("miniTrending");if(!b)return;var l=posts.filter(function(p){return!p.deleted}).sort(function(a,b){return(b.votes||0)-(a.votes||0)}).slice(0,5);b.innerHTML=l.length?l.map(function(p,i){return'<div style="padding:9px 0;border-bottom:1px solid #1e232c;font-size:13.5px;color:#c9ced6"><b style="color:#6ea8fe">#'+(i+1)+'</b> '+escapeHTML(p.body.substring(0,60))+'</div>'}).join(""):'<div style="color:#8b94a3;font-size:13px">Belum ada trending.</div>'}
function renderProfile(){var mp=posts.filter(function(p){return p.userId===currentUser.id&&!p.deleted}),tv=mp.reduce(function(a,p){return a+(p.votes||0)},0),mc=comments.filter(function(c){return c.userId===currentUser.id}).length;document.getElementById("main").innerHTML='<div class="card"><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="avatar big">'+escapeHTML(currentUser.avatar)+'</div><div style="flex:1;min-width:0"><h2 style="margin:0;font-size:20px">'+escapeHTML(currentUser.name)+'</h2><div style="color:#8b94a3;font-size:13px">'+escapeHTML(currentUser.email)+'</div><div style="margin-top:8px"><span class="badge '+(currentUser.role==="admin"?"admin":"")+'">'+(currentUser.role==="admin"?"admin":"user")+'</span></div></div></div><div class="stat-grid" style="margin-top:18px"><div class="stat"><div class="label">Postingan</div><div class="value">'+mp.length+'</div></div><div class="stat"><div class="label">Total Vote</div><div class="value">'+tv+'</div></div><div class="stat"><div class="label">Komentar</div><div class="value">'+mc+'</div></div></div></div>'+(mp.length?mp.map(renderPost).join(""):'<div class="card empty">Lu belum membuat postingan.</div>')}
function renderAdmin(){if(currentUser.role!=="admin"){document.getElementById("main").innerHTML='<div class="card empty">'+IC("ban","ic-lg")+'<br><br>Akses admin ditolak.</div>';return}var tv=posts.reduce(function(a,p){return a+(p.votes||0)},0);document.getElementById("main").innerHTML='<div class="card"><h2 class="card-title">'+IC("crown")+' Panel Admin</h2><div class="stat-grid"><div class="stat"><div class="label">Pengguna</div><div class="value">'+users.length+'</div></div><div class="stat"><div class="label">Posting</div><div class="value">'+posts.filter(function(p){return!p.deleted}).length+'</div></div><div class="stat"><div class="label">Komentar</div><div class="value">'+comments.length+'</div></div><div class="stat"><div class="label">Pesan</div><div class="value">'+chats.length+'</div></div><div class="stat"><div class="label">Total Vote</div><div class="value">'+tv+'</div></div><div class="stat"><div class="label">Terblokir</div><div class="value">'+users.filter(function(u){return u.banned}).length+'</div></div></div><h3>Kelola Pengguna</h3><div id="adminUsers"></div><h3 style="margin-top:24px">Kelola Postingan</h3><div id="adminPosts"></div><h3 style="margin-top:24px">Log Aktivitas</h3><div id="adminLog" style="max-height:300px;overflow:auto"></div><h3 style="margin-top:24px;color:#fca5a5">Zona Berbahaya</h3><button class="btn primary" style="background:#dc2626;color:white" onclick="resetDatabase()">Reset Semua Data</button></div>';renderAdminUsers();renderAdminPosts();renderAdminLog()}
function renderAdminUsers(){var b=document.getElementById("adminUsers");if(!b)return;b.innerHTML=users.map(function(u){var me=u.id===currentUser.id;return'<div class="user-row"><div class="avatar">'+escapeHTML(u.avatar)+'</div><div class="info"><div class="name">'+escapeHTML(u.name)+(u.role==="admin"?' <span class="badge admin">admin</span>':"")+(u.banned?' <span class="badge banned">banned</span>':"")+'</div><div class="email">'+escapeHTML(u.email)+'</div></div>'+(me?'<span style="color:#8b94a3;font-size:12px">(kamu)</span>':'<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="action small" onclick="toggleRole(\''+u.id+'\')">'+(u.role==="admin"?"User":"Admin")+'</button><button class="action small" onclick="toggleBan(\''+u.id+'\')">'+(u.banned?"Unban":"Ban")+'</button><button class="action small danger" onclick="deleteUser(\''+u.id+'\')">'+IC("trash","ic-sm")+'</button></div>')+'</div>'}).join("")}
function renderAdminPosts(){var b=document.getElementById("adminPosts");if(!b)return;var l=posts.filter(function(p){return!p.deleted}).slice(0,20);b.innerHTML=l.length?l.map(function(p){var u=users.find(function(x){return x.id===p.userId})||{name:"?"};return'<div class="user-row"><div class="info"><div class="name">'+escapeHTML(u.name)+'</div><div class="email">'+escapeHTML(p.body.substring(0,80))+'</div></div><button class="action small danger" onclick="deletePost(\''+p.id+'\');renderAdmin()">'+IC("trash","ic-sm")+'</button></div>'}).join(""):'<div style="color:#8b94a3;font-size:13px">Belum ada postingan.</div>'}
function renderAdminLog(){var b=document.getElementById("adminLog");if(!b)return;if(!activityLog.length){b.innerHTML='<div style="color:#8b94a3;font-size:13px">Belum ada aktivitas.</div>';return}b.innerHTML=activityLog.slice().reverse().slice(0,50).map(function(l){return'<div style="padding:8px 10px;border-bottom:1px solid #1e232c;font-size:13px"><span style="color:#6ea8fe">'+escapeHTML(l.by)+'</span> - '+escapeHTML(l.text)+' <span style="color:#8b94a3;font-size:11.5px;float:right">'+formatDate(l.at)+'</span></div>'}).join("")}
function toggleRole(id){var u=users.find(function(x){return x.id===id});if(!u)return;u.role=u.role==="admin"?"user":"admin";logAction("Ubah role "+u.name+" menjadi "+u.role);saveAll();renderAdmin()}
function toggleBan(id){var u=users.find(function(x){return x.id===id});if(!u)return;u.banned=!u.banned;logAction((u.banned?"Ban ":"Unban ")+u.name);saveAll();renderAdmin()}
function deleteUser(id){var u=users.find(function(x){return x.id===id});if(!u)return;if(!confirm('Yakin hapus user "'+u.name+'"? Semua postingan & chat-nya akan ikut terhapus.'))return;users=users.filter(function(x){return x.id!==id});posts=posts.filter(function(p){return p.userId!==id});comments=comments.filter(function(c){return c.userId!==id});chats=chats.filter(function(c){return c.from!==id&&c.to!==id});logAction("Hapus user "+u.name);saveAll();renderAdmin()}
function resetDatabase(){if(!confirm("PERINGATAN!\nSemua data akan dihapus permanen.\nLanjut?"))return;if(!confirm("Yakin banget? Tidak bisa dibatalkan!"))return;users=[];posts=[];chats=[];saved=[];comments=[];activityLog=[];saveAll();try{localStorage.removeItem("ms_session")}catch(e){}location.reload()}
function openModal(h){document.getElementById("modal").innerHTML=h;document.getElementById("modalBg").classList.remove("hidden")}function closeModal(e){if(!e||e.target===document.getElementById("modalBg"))document.getElementById("modalBg").classList.add("hidden")}
function escapeHTML(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function formatDate(d){try{return new Date(d).toLocaleString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return String(d||"")}}function uid(){if(window.crypto&&typeof crypto.randomUUID==="function")return crypto.randomUUID();return"id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10)}function toggleSearch(){var e=document.getElementById("search");if(!e)return;e.classList.toggle("open");if(e.classList.contains("open"))e.focus()}
start();
</script>
